<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JIBWIS Nguru - First Aid System</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
    <style>
        :root { --primary: #1b5e20; --gold: #ffd700; --danger: #c62828; --bg: #f4f7f6; }
        body { font-family: 'Poppins', sans-serif; margin: 0; background: var(--bg); overflow-x: hidden; }
        .hidden { display: none !important; }
        
        /* Login */
        #loginPage { height: 100vh; display: flex; align-items: center; justify-content: center; background: var(--primary); }
        .login-card { background: white; padding: 40px; border-radius: 15px; width: 350px; text-align: center; box-shadow: 0 10px 30px rgba(0,0,0,0.3); }
        input { width: 100%; padding: 12px; margin: 10px 0; border: 1px solid #ddd; border-radius: 8px; box-sizing: border-box; }
        
        /* Sidebar */
        #dashPage { display: flex; min-height: 100vh; }
        .sidebar { width: 260px; background: var(--primary); color: white; transition: 0.3s; position: fixed; height: 100vh; }
        .main { margin-left: 260px; flex: 1; padding: 30px; }
        .nav-item { padding: 15px 25px; cursor: pointer; border-bottom: 1px solid rgba(255,255,255,0.05); transition: 0.2s; }
        .nav-item:hover { background: rgba(255,255,255,0.1); }
        
        /* Table */
        .card { background: white; padding: 25px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        th { text-align: left; background: #fafafa; padding: 15px; color: #666; font-size: 13px; }
        td { padding: 15px; border-bottom: 1px solid #eee; }
        
        /* Buttons */
        .btn { padding: 10px 20px; border: none; border-radius: 6px; cursor: pointer; font-weight: 600; font-family: inherit; }
        .btn-green { background: var(--primary); color: white; }
        .btn-gold { background: var(--gold); color: black; }
        .btn-red { background: #fff1f0; color: var(--danger); border: 1px solid var(--danger); }
    </style>
</head>
<body>

<div id="loginPage">
    <div class="login-card">
        <h2 style="color: var(--primary)">JIBWIS NGURU</h2>
        <p>First Aid Group Login</p>
        <input type="text" id="u" placeholder="Username">
        <input type="password" id="p" placeholder="Password">
        <button class="btn btn-green" style="width:100%" id="loginBtn" onclick="doLogin()">Login</button>
    </div>
</div>

<div id="dashPage" class="hidden">
    <div class="sidebar">
        <div style="padding: 30px 25px; border-bottom: 1px solid rgba(255,255,255,0.1)">
            <h3 style="margin:0">JIBWIS NGURU</h3>
            <small id="roleText" style="color: var(--gold)"></small>
        </div>
        <div class="nav-item" onclick="showSection('recruits')">📋 Recruits</div>
        <div id="adminLink" class="nav-item hidden" onclick="showSection('officers')">👨‍✈️ Manage Officers</div>
        <div class="nav-item" onclick="location.reload()" style="margin-top: 50px; color: #ffab91;">🚪 Logout</div>
    </div>

    <div class="main">
        <div id="recruitsSection">
            <div style="display:flex; justify-content: space-between; align-items:center;">
                <h2>Recruits Management</h2>
                <button class="btn btn-green" onclick="add('Recruit')">+ Add Recruit</button>
            </div>
            <div class="card">
                <table>
                    <thead><tr><th>Name</th><th>Officer</th><th>Attendance</th><th>Action</th></tr></thead>
                    <tbody id="rBody"></tbody>
                </table>
            </div>
        </div>

        <div id="officersSection" class="hidden">
            <div style="display:flex; justify-content: space-between; align-items:center;">
                <h2>Training Officers</h2>
                <button class="btn btn-green" onclick="add('Officer')">+ Add Officer</button>
            </div>
            <div class="card">
                <table>
                    <thead><tr><th>Name</th><th>Username</th><th>Action</th></tr></thead>
                    <tbody id="oBody"></tbody>
                </table>
            </div>
        </div>
    </div>
</div>

<script>
    const API_URL = "https://script.google.com/macros/s/AKfycbyMmxj09yTqmPgz4fpzY9qGGQx-sA0fLzg21wXPe1YBU86OVbt0jkXOqxuoNH25gIkk/exec";
    let ME = "", ROLE = "";
    const isWeekend = [0, 6].includes(new Date().getDay());

    async function apiCall(data) {
        const response = await fetch(API_URL, {
            method: 'POST',
            body: JSON.stringify(data)
        });
        return response.json();
    }

    async function doLogin() {
        const u = document.getElementById('u').value;
        const p = document.getElementById('p').value;
        const btn = document.getElementById('loginBtn');
        
        btn.innerText = "Loading...";
        btn.disabled = true;

        try {
            const res = await apiCall({ action: "login", u, p });
            if (res.success) {
                ME = res.name; ROLE = res.role;
                document.getElementById('loginPage').classList.add('hidden');
                document.getElementById('dashPage').classList.remove('hidden');
                document.getElementById('roleText').innerText = ROLE + " | " + ME;
                if(ROLE === 'Admin') document.getElementById('adminLink').classList.remove('hidden');
                loadData();
            } else {
                alert("Invalid Credentials");
                btn.innerText = "Login";
                btn.disabled = false;
            }
        } catch (e) {
            alert("Error connecting to server. Make sure you deployed as 'Anyone'.");
            btn.innerText = "Login";
            btn.disabled = false;
        }
    }

    async function loadData() {
        const recruits = await apiCall({ action: "getRecruits", role: ROLE, user: ME });
        let h = "";
        recruits.forEach(r => {
            h += `<tr>
                <td><b>${r[1]}</b></td>
                <td>${r[2]}</td>
                <td>${r[3]}</td>
                <td>
                    ${isWeekend ? `<button class="btn btn-gold" onclick="mark('${r[0]}')">Present</button>` : '<small>Weekends Only</small>'}
                    ${ROLE === 'Admin' ? `<button class="btn btn-red" onclick="del('Recruits','${r[0]}')">Del</button>` : ''}
                </td>
            </tr>`;
        });
        document.getElementById('rBody').innerHTML = h || "<tr><td colspan='4'>No records found.</td></tr>";

        if (ROLE === 'Admin') {
            const officers = await apiCall({ action: "getOfficers" });
            let oh = "";
            officers.forEach(o => {
                oh += `<tr><td>${o[1]}</td><td>${o[2]}</td><td><button class="btn btn-red" onclick="del('Officers','${o[0]}')">Remove</button></td></tr>`;
            });
            document.getElementById('oBody').innerHTML = oh;
        }
    }

    async function mark(id) {
        await apiCall({ action: "mark", id, user: ME });
        loadData();
    }

    async function del(type, id) {
        if(confirm("Delete this record permanently?")) {
            await apiCall({ action: "delete", type, id });
            loadData();
        }
    }

    function showSection(s) {
        document.getElementById('recruitsSection').classList.toggle('hidden', s !== 'recruits');
        document.getElementById('officersSection').classList.toggle('hidden', s !== 'officers');
    }

    async function add(type) {
        let n = prompt("Enter Name:");
        if(!n) return;
        if(type === 'Recruit') {
            await apiCall({ action: "addRecruit", name: n, user: ME });
        } else {
            let u = prompt("Username:"), p = prompt("Password:");
            await apiCall({ action: "addOfficer", name: n, u, p });
        }
        loadData();
    }
</script>
</body>
  </html>
