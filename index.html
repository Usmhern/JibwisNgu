<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JIBWIS Dashboard</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;600&display=swap" rel="stylesheet">

<style>
:root{
    --bg:#0f0f1a;
    --card:#1a1a2e;
    --accent:#8e2de2;
    --text:#ffffff;
    --muted:#aaa;
}

*{margin:0;padding:0;box-sizing:border-box;font-family:Poppins;}

body{
    background: var(--bg);
    color: var(--text);
}

/* LAYOUT */
.container{
    display:flex;
    min-height:100vh;
}

/* SIDEBAR */
.sidebar{
    width:240px;
    background:#111;
    padding:20px;
}

.logo{
    font-size:20px;
    font-weight:600;
    margin-bottom:30px;
}

.nav{
    padding:12px;
    margin-bottom:10px;
    cursor:pointer;
    border-radius:8px;
}

.nav:hover{
    background:rgba(255,255,255,0.05);
}

/* MAIN */
.main{
    flex:1;
    display:flex;
    flex-direction:column;
}

/* TOPBAR */
.topbar{
    padding:15px 25px;
    background:#151528;
    border-bottom:1px solid rgba(255,255,255,0.05);
    display:flex;
    justify-content:space-between;
}

/* CONTENT */
.content{
    padding:25px;
}

/* CARD */
.card{
    background:var(--card);
    padding:20px;
    border-radius:12px;
    margin-top:20px;
}

/* TABLE */
.table-wrap{
    overflow-x:auto;
}

table{
    width:100%;
    border-collapse:collapse;
}

th,td{
    padding:12px;
    text-align:left;
}

th{
    color:var(--muted);
}

/* BUTTON */
.btn{
    padding:8px 14px;
    background:var(--accent);
    border:none;
    border-radius:6px;
    color:white;
    cursor:pointer;
}

/* LOGIN */
#loginPage{
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
}

.login-box{
    background:var(--card);
    padding:35px;
    border-radius:12px;
    width:320px;
}

input{
    width:100%;
    padding:12px;
    margin:10px 0;
    border:none;
    border-radius:6px;
}

/* MODAL */
.modal{
    position:fixed;
    top:0;
    left:0;
    width:100%;
    height:100%;
    background:rgba(0,0,0,0.7);
    display:flex;
    justify-content:center;
    align-items:center;
}

.modal-box{
    background:var(--card);
    padding:25px;
    border-radius:10px;
    width:300px;
}

/* MOBILE */
@media(max-width:768px){
    .sidebar{display:none;}
    .topbar{font-size:14px;}
}
.hidden{display:none}
</style>
</head>

<body>

<!-- LOGIN -->
<div id="loginPage">
    <div class="login-box">
        <h2>Login</h2>
        <input id="u" placeholder="Username">
        <input id="p" type="password" placeholder="Password">
        <button class="btn" onclick="login()">Login</button>
    </div>
</div>

<!-- DASHBOARD -->
<div id="dash" class="hidden">
<div class="container">

<!-- SIDEBAR -->
<div class="sidebar">
    <div class="logo">JIBWIS</div>
    <div class="nav" onclick="show('r')">Recruits</div>
    <div id="adminNav" class="nav hidden" onclick="show('o')">Officers</div>
</div>

<!-- MAIN -->
<div class="main">

<div class="topbar">
    <div>Dashboard</div>
    <div id="userInfo"></div>
</div>

<div class="content">

<!-- RECRUITS -->
<div id="rSec">
    <h2>Recruits</h2>
    <button class="btn" onclick="openModal('Recruit')">+ Add Recruit</button>

    <div class="card table-wrap">
        <table>
            <thead>
                <tr><th>Name</th><th>Officer</th><th>Attendance</th></tr>
            </thead>
            <tbody id="rBody"></tbody>
        </table>
    </div>
</div>

<!-- OFFICERS -->
<div id="oSec" class="hidden">
    <h2>Officers</h2>
    <button class="btn" onclick="openModal('Officer')">+ Add Officer</button>

    <div class="card table-wrap">
        <table>
            <thead>
                <tr><th>Name</th><th>Username</th></tr>
            </thead>
            <tbody id="oBody"></tbody>
        </table>
    </div>
</div>

</div>
</div>
</div>
</div>

<!-- MODAL -->
<div id="modal" class="modal hidden">
    <div class="modal-box">
        <h3 id="title"></h3>
        <input id="name">
        <div id="extra" class="hidden">
            <input id="user">
            <input id="pass">
        </div>
        <button class="btn" onclick="save()">Save</button>
        <button onclick="modal.classList.add('hidden')">Cancel</button>
    </div>
</div>

<script>
const API="https://script.google.com/macros/s/AKfycbyMmxj09yTqmPgz4fpzY9qGGQx-sA0fLzg21wXPe1YBU86OVbt0jkXOqxuoNH25gIkk/exec";

let ROLE="",ME="",TYPE="";

/* LOGIN */
async function login(){
    let u=document.getElementById("u").value;
    let p=document.getElementById("p").value;

    let res=await fetch(API,{method:"POST",body:JSON.stringify({action:"login",u,p})});
    let d=await res.json();

    if(d.success){
        ROLE=d.role; ME=d.name;

        loginPage.classList.add("hidden");
        dash.classList.remove("hidden");

        userInfo.innerText=ROLE+" | "+ME;

        if(ROLE==="Admin") adminNav.classList.remove("hidden");

        load();
    }else alert("Login failed");
}

/* LOAD */
async function load(){
    let r=await fetch(API,{method:"POST",body:JSON.stringify({action:"getRecruits",role:ROLE,user:ME})});
    let rd=await r.json();

    rBody.innerHTML=rd.map(x=>`<tr><td>${x[1]}</td><td>${x[2]}</td><td>${x[3]}</td></tr>`).join("");

    if(ROLE==="Admin"){
        let o=await fetch(API,{method:"POST",body:JSON.stringify({action:"getOfficers"})});
        let od=await o.json();

        oBody.innerHTML=od.map(x=>`<tr><td>${x[1]}</td><td>${x[2]}</td></tr>`).join("");
    }
}

/* MODAL */
function openModal(t){
    TYPE=t;
    modal.classList.remove("hidden");
    title.innerText="Add "+t;
    extra.classList.toggle("hidden",t!=="Officer");
}

async function save(){
    let name=document.getElementById("name").value;

    if(TYPE==="Recruit"){
        await fetch(API,{method:"POST",body:JSON.stringify({action:"addRecruit",name,user:ME})});
    }else{
        await fetch(API,{method:"POST",body:JSON.stringify({
            action:"addOfficer",
            name,
            u:user.value,
            p:pass.value
        })});
    }

    modal.classList.add("hidden");
    load();
}

/* NAV */
function show(s){
    rSec.classList.toggle("hidden",s!=="r");
    oSec.classList.toggle("hidden",s!=="o");
}
</script>

</body>
</html>
