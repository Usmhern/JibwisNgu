<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>JIBWIS Portal</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap');
        body { font-family: 'Inter', sans-serif; -webkit-tap-highlight-color: transparent; }
        .tab-active { color: #059669; border-top: 2px solid #059669; }
    </style>
</head>
<body class="bg-slate-50 min-h-screen">

    <div id="loader" class="fixed inset-0 bg-white z-[100] flex items-center justify-center">
        <div class="text-center">
            <div class="animate-spin rounded-full h-12 w-12 border-b-2 border-emerald-600 mx-auto"></div>
            <p class="mt-4 text-slate-500 font-medium">Authenticating...</p>
        </div>
    </div>

    <div id="app" class="hidden pb-24">
        
        <header id="header-bg" class="p-6 text-white transition-colors duration-500">
            <div class="max-w-md mx-auto flex justify-between items-center">
                <div>
                    <h1 id="portal-title" class="text-xl font-extrabold tracking-tight">JIBWIS PORTAL</h1>
                    <p id="user-email" class="text-[10px] opacity-80 uppercase font-bold tracking-widest"></p>
                </div>
                <div id="role-badge" class="px-2 py-1 rounded text-[10px] font-black border border-white/30 uppercase"></div>
            </div>
        </header>

        <main class="max-w-md mx-auto p-4 space-y-4">
            
            <section id="view-mark" class="view hidden space-y-4">
                <div id="weekend-warning" class="hidden bg-amber-100 p-4 rounded-2xl text-amber-800 text-sm font-medium flex items-center">
                    <i data-lucide="lock" class="w-4 h-4 mr-2"></i> Only Saturday/Sunday marking allowed.
                </div>
                
                <div class="bg-white rounded-3xl shadow-xl p-8 text-center border border-slate-100">
                    <h2 class="text-slate-400 text-[10px] font-black tracking-[0.2em] uppercase mb-8">Active Recruit</h2>
                    <div id="name-display" class="text-3xl font-black text-slate-800 h-24 flex items-center justify-center">--</div>
                    <div class="grid grid-cols-2 gap-4 mt-8">
                        <button onclick="submit(1)" class="bg-emerald-600 text-white py-5 rounded-2xl font-bold shadow-lg shadow-emerald-100 active:scale-95 transition-all">PRESENT</button>
                        <button onclick="submit(0)" class="bg-slate-800 text-white py-5 rounded-2xl font-bold active:scale-95 transition-all">ABSENT</button>
                    </div>
                </div>
            </section>

            <section id="view-list" class="view hidden space-y-4">
                <div class="bg-white rounded-3xl p-6 shadow-sm">
                    <h3 class="font-black text-slate-800 text-sm mb-6 uppercase tracking-widest">Attendance Record</h3>
                    <div id="stats-container" class="space-y-4 text-sm text-slate-600"></div>
                </div>
            </section>

            <section id="view-central" class="view hidden space-y-4">
                <div class="bg-slate-900 rounded-3xl p-6 text-white shadow-2xl">
                    <h3 class="font-bold mb-4">Assign New Admin</h3>
                    <div class="flex gap-2">
                        <input type="email" id="new-admin-email" placeholder="Gmail Address" class="flex-1 bg-slate-800 border-none rounded-xl p-3 text-sm focus:ring-2 focus:ring-emerald-500 outline-none">
                        <button onclick="addAdmin()" class="bg-emerald-500 p-3 rounded-xl"><i data-lucide="plus"></i></button>
                    </div>
                </div>
                <div class="bg-white rounded-3xl p-6 shadow-sm">
                    <h3 class="font-black text-slate-800 text-sm mb-4 uppercase tracking-widest text-center">Staff Directory</h3>
                    <div id="admin-directory" class="divide-y text-sm"></div>
                </div>
            </section>

        </main>

        <nav class="fixed bottom-0 left-0 right-0 bg-white border-t border-slate-100 px-6 py-3 flex justify-around items-center z-50">
            <button onclick="switchView('mark')" id="nav-mark" class="flex flex-col items-center text-slate-400">
                <i data-lucide="edit-3" class="w-5 h-5"></i>
                <span class="text-[9px] font-bold mt-1">MARK</span>
            </button>
            <button onclick="switchView('list')" id="nav-list" class="flex flex-col items-center text-slate-400">
                <i data-lucide="layout-list" class="w-5 h-5"></i>
                <span class="text-[9px] font-bold mt-1">RECORDS</span>
            </button>
            <button onclick="switchView('central')" id="nav-central" class="hidden flex flex-col items-center text-slate-400">
                <i data-lucide="shield-check" class="w-5 h-5"></i>
                <span class="text-[9px] font-bold mt-1">ADMIN</span>
            </button>
        </nav>
    </div>

<script>
    const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbxqrR0ZIQLBSjdfpsYbQRCGUcrb1T14LuEZ9-0-FuqpaR_UmPvIeGOJLOUSUu9ABveS3g/exec'; // PASTE YOUR URL HERE
    let state = { role: '', recruits: [], index: 0, email: '' };

    async function init() {
        lucide.createIcons();
        const res = await fetch(`${SCRIPT_URL}?mode=fetch`);
        const data = await res.json();

        if(data.error) {
            document.body.innerHTML = `<div class="p-10 text-center font-bold text-slate-400">${data.error}<br>${data.email}</div>`;
            return;
        }

        state = { ...state, ...data };
        document.getElementById('user-email').innerText = state.email;
        document.getElementById('role-badge').innerText = state.role;
        document.getElementById('loader').classList.add('hidden');
        document.getElementById('app').classList.remove('hidden');

        if(state.role === 'SUPER_ADMIN') {
            document.getElementById('header-bg').className = 'bg-slate-900 p-6 text-white shadow-lg';
            document.getElementById('nav-central').classList.remove('hidden');
            switchView('central');
        } else {
            document.getElementById('header-bg').className = 'bg-emerald-600 p-6 text-white shadow-lg';
            switchView('mark');
        }
    }

    function switchView(view) {
        document.querySelectorAll('.view').forEach(v => v.classList.add('hidden'));
        document.querySelectorAll('nav button').forEach(b => b.classList.remove('tab-active'));
        
        document.getElementById(`view-${view}`).classList.remove('hidden');
        document.getElementById(`nav-${view}`).classList.add('tab-active');

        if(view === 'mark') renderMarking();
        if(view === 'list') renderStats();
        if(view === 'central') renderAdminList();
    }

    function renderMarking() {
        const isWeekend = [0, 6].includes(new Date().getDay());
        if(!isWeekend) document.getElementById('weekend-warning').classList.remove('hidden');
        
        const display = document.getElementById('name-display');
        if(state.index < state.recruits.length) {
            display.innerText = state.recruits[state.index];
        } else {
            display.innerHTML = '<div class="text-emerald-500 text-sm font-bold uppercase tracking-widest">Session Complete</div>';
        }
    }

    async function submit(status) {
        const name = state.recruits[state.index];
        state.index++;
        renderMarking();

        await fetch(SCRIPT_URL, {
            method: 'POST',
            body: JSON.stringify({ name, status })
        });
    }

    async function renderStats() {
        const res = await fetch(`${SCRIPT_URL}?mode=stats`);
        const stats = await res.json();
        document.getElementById('stats-container').innerHTML = stats.map(s => `
            <div class="flex justify-between items-center">
                <span class="font-semibold text-slate-700">${s.name}</span>
                <span class="font-black text-emerald-600 bg-emerald-50 px-2 py-1 rounded-lg">${s.percentage}%</span>
            </div>
        `).join('');
    }

    async function renderAdminList() {
        const res = await fetch(`${SCRIPT_URL}?mode=manage_admins`);
        const list = await res.json();
        document.getElementById('admin-directory').innerHTML = list.map(a => `
            <div class="py-3 flex justify-between">
                <span class="text-slate-600">${a[0]}</span>
                <span class="text-[10px] font-bold text-slate-400 uppercase">${a[1]}</span>
            </div>
        `).join('');
        lucide.createIcons();
    }

    async function addAdmin() {
        const email = document.getElementById('new-admin-email').value;
        if(!email) return;
        await fetch(SCRIPT_URL, { method: 'POST', body: JSON.stringify({ action: 'add_admin', newEmail: email }) });
        alert("Admin Assigned");
        renderAdminList();
    }

    init();
</script>
</body>
</html>
