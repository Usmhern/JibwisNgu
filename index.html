<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>JIBWIS First Aid System</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700&display=swap" rel="stylesheet">

<style>
:root{
    --bg1:#0f0c29;
    --bg2:#302b63;
    --bg3:#24243e;
    --purple:#8e2de2;
    --glass: rgba(255,255,255,0.05);
}

*{margin:0;padding:0;box-sizing:border-box;font-family:Poppins;}

body{
    background: linear-gradient(270deg,var(--bg1),var(--bg2),var(--bg3));
    background-size:600% 600%;
    animation: bgMove 12s ease infinite;
    color:white;
}

@keyframes bgMove{
    0%{background-position:0%}
    50%{background-position:100%}
    100%{background-position:0%}
}

.hidden{display:none}

/* LOGIN */
#loginPage{
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
}

.login-box{
    background:var(--glass);
    backdrop-filter:blur(15px);
    padding:40px;
    border-radius:15px;
    width:320px;
    text-align:center;
}

input{
    width:100%;
    padding:12px;
    margin:10px 0;
    border:none;
    border-radius:8px;
}

button{
    width:100%;
    padding:12px;
    border:none;
    border-radius:8px;
    background:var(--purple);
    color:white;
    cursor:pointer;
}

/* DASHBOARD */
#dashPage{
    display:flex;
}

/* SIDEBAR */
.sidebar{
    width:230px;
    background:rgba(0,0,0,0.4);
    height:100vh;
    padding:20px;
    position:fixed;
}

.nav{
    margin-top:20px;
    cursor:pointer;
    padding:10px;
}

.nav:hover{
    background:rgba(255,255,255,0.1);
}

/* MAIN */
.main{
    margin-left:230px;
    padding:20px;
    width:100%;
}

/* CARD */
.card{
    background:var(--glass);
    backdrop-filter:blur(10px);
    padding:20px;
    border-radius:10px;
    margin-top:20px;
    overflow-x:auto;
}

/* TABLE */
table{
    width:100%;
    border-collapse:collapse;
}

th,td{
    padding:10px;
    text-align:left;
}

th{
    color:#bbb;
}

/* MODAL */
.modal{
    position:fixed;
    top:0;
    left:0;
    width:100%;
    height:100%;
    background:rgba(0,0,0,0.7);
    display:flex;
    justify-content:center;
    align-items:center;
}

.modal-box{
    background:#111;
    padding:25px;
    border-radius:10px;
    width:300px;
}

/* MOBILE */
@media(max-width:768px){
    .sidebar{width:180px}
    .main{margin-left:180px}
}
</style>
</head>

<body>

<!-- LOGIN -->
<div id="loginPage">
    <div class="login-box">
        <h2>JIBWIS</h2>
        <input id="u" placeholder="Username">
        <input id="p" type="password" placeholder="Password">
        <button onclick="doLogin()">Login</button>
    </div>
</div>

<!-- DASHBOARD -->
<div id="dashPage" class="hidden">

<div class="sidebar">
    <h3 id="roleText"></h3>
    <div class="nav" onclick="show('r')">Recruits</div>
    <div class="nav hidden" id="adminNav" onclick="show('o')">Officers</div>
</div>

<div class="main">

<div id="rSec">
    <h2>Recruits</h2>
    <button onclick="openModal('Recruit')">+ Add</button>

    <div class="card">
        <table>
            <thead>
                <tr><th>Name</th><th>Officer</th><th>Attendance</th></tr>
            </thead>
            <tbody id="rBody"></tbody>
        </table>
    </div>
</div>

<div id="oSec" class="hidden">
    <h2>Officers</h2>
    <button onclick="openModal('Officer')">+ Add</button>

    <div class="card">
        <table>
            <thead>
                <tr><th>Name</th><th>Username</th></tr>
            </thead>
            <tbody id="oBody"></tbody>
        </table>
    </div>
</div>

</div>
</div>

<!-- MODAL -->
<div id="modal" class="modal hidden">
    <div class="modal-box">
        <h3 id="mTitle"></h3>
        <input id="name">
        <div id="extra" class="hidden">
            <input id="user">
            <input id="pass">
        </div>
        <button onclick="save()">Save</button>
        <button onclick="closeModal()">Cancel</button>
    </div>
</div>

<script>
const API="https://script.google.com/macros/s/AKfycbyMmxj09yTqmPgz4fpzY9qGGQx-sA0fLzg21wXPe1YBU86OVbt0jkXOqxuoNH25gIkk/exec";

let ROLE="",ME="",TYPE="";

/* FIXED LOGIN */
async function doLogin(){
    let u=document.getElementById("u").value;
    let p=document.getElementById("p").value;

    let res=await fetch(API,{method:"POST",body:JSON.stringify({action:"login",u,p})});
    let data=await res.json();

    if(data.success){
        ROLE=data.role;
        ME=data.name;

        loginPage.classList.add("hidden");
        dashPage.classList.remove("hidden");

        roleText.innerText=ROLE+" | "+ME;

        if(ROLE==="Admin") adminNav.classList.remove("hidden");

        load();
    }else alert("Login failed");
}

/* LOAD */
async function load(){
    let r=await fetch(API,{method:"POST",body:JSON.stringify({action:"getRecruits",role:ROLE,user:ME})});
    let rd=await r.json();

    rBody.innerHTML=rd.map(x=>`<tr><td>${x[1]}</td><td>${x[2]}</td><td>${x[3]}</td></tr>`).join("");

    if(ROLE==="Admin"){
        let o=await fetch(API,{method:"POST",body:JSON.stringify({action:"getOfficers"})});
        let od=await o.json();

        oBody.innerHTML=od.map(x=>`<tr><td>${x[1]}</td><td>${x[2]}</td></tr>`).join("");
    }
}

/* MODAL */
function openModal(t){
    TYPE=t;
    modal.classList.remove("hidden");
    mTitle.innerText="Add "+t;

    extra.classList.toggle("hidden",t!=="Officer");
}

function closeModal(){
    modal.classList.add("hidden");
}

/* SAVE */
async function save(){
    let name=document.getElementById("name").value;

    if(TYPE==="Recruit"){
        await fetch(API,{method:"POST",body:JSON.stringify({action:"addRecruit",name,user:ME})});
    }else{
        await fetch(API,{method:"POST",body:JSON.stringify({
            action:"addOfficer",
            name,
            u:user.value,
            p:pass.value
        })});
    }

    closeModal();
    load();
}

/* NAV */
function show(s){
    rSec.classList.toggle("hidden",s!=="r");
    oSec.classList.toggle("hidden",s!=="o");
}
</script>

</body>
</html>
