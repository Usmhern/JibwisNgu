<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JIBWIS First Aid</title>

<style>
:root{
--primary:#1b5e20;
--secondary:#2e7d32;
--accent:#ffd700;
--danger:#c62828;
--bg:#f4f7f6;
--white:#fff;
}

body{
margin:0;
font-family:Poppins, sans-serif;
background:var(--bg);
}

/* LOGIN */
#loginPage{
display:flex;
justify-content:center;
align-items:center;
height:100vh;
background:linear-gradient(135deg,var(--primary),var(--secondary));
}

.login-card{
background:white;
padding:25px;
border-radius:12px;
width:90%;
max-width:350px;
text-align:center;
}

input{
width:100%;
padding:12px;
margin:10px 0;
border-radius:6px;
border:1px solid #ddd;
}

/* BUTTON */
.btn{
padding:10px;
border:none;
border-radius:6px;
cursor:pointer;
font-weight:bold;
}

.btn-primary{background:var(--primary);color:white}
.btn-danger{background:var(--danger);color:white}
.btn-accent{background:var(--accent)}

/* DASHBOARD */
#dashboardPage{
display:none;
}

/* SIDEBAR */
.sidebar{
position:fixed;
left:-250px;
top:0;
width:250px;
height:100%;
background:var(--primary);
color:white;
transition:0.3s;
padding-top:20px;
z-index:1000;
}

.sidebar.active{left:0}

.nav-item{
padding:15px;
cursor:pointer;
}

.nav-item:hover{background:rgba(255,255,255,0.1)}

/* MAIN */
.main{
padding:15px;
}

/* TOP */
.topbar{
display:flex;
justify-content:space-between;
align-items:center;
}

.menu-btn{
background:var(--primary);
color:white;
padding:10px;
border:none;
}

/* CARD */
.card{
background:white;
padding:15px;
border-radius:10px;
overflow:auto;
}

/* TABLE */
table{
width:100%;
min-width:500px;
border-collapse:collapse;
}

th,td{
padding:10px;
border-bottom:1px solid #eee;
}

/* DESKTOP */
@media(min-width:768px){
.sidebar{left:0}
.main{margin-left:260px}
.menu-btn{display:none}
}
</style>
</head>

<body>

<!-- LOGIN -->
<div id="loginPage">
<div class="login-card">
<h2>JIBWIS NGURU</h2>

<input id="userInp" placeholder="Username">
<input id="passInp" type="password" placeholder="Password">

<button class="btn btn-primary" style="width:100%" onclick="handleLogin()">Login</button>
<p id="errorMsg" style="color:red"></p>
</div>
</div>

<!-- DASHBOARD -->
<div id="dashboardPage">

<div class="sidebar" id="sidebar">
<h3 style="text-align:center">JIBWIS</h3>

<div class="nav-item" onclick="switchTab('recruits')">Recruits</div>
<div class="nav-item" id="adminLink" style="display:none" onclick="switchTab('officers')">Officers</div>
<div class="nav-item" onclick="logout()">Logout</div>
</div>

<div class="main">

<button class="menu-btn" onclick="toggleMenu()">☰</button>

<!-- RECRUITS -->
<div id="recruitView">
<div class="topbar">
<h3>Recruits</h3>
<button class="btn btn-primary" onclick="openAddRecruit()">+ Add</button>
</div>

<div class="card">
<table>
<thead>
<tr>
<th>Name</th>
<th>Added By</th>
<th>Days</th>
<th>Action</th>
</tr>
</thead>
<tbody id="recruitTableBody"></tbody>
</table>
</div>
</div>

<!-- OFFICERS -->
<div id="officerView" style="display:none">
<div class="topbar">
<h3>Officers</h3>
<button class="btn btn-primary" onclick="openAddOfficer()">+ Add</button>
</div>

<div class="card">
<table>
<thead>
<tr>
<th>Name</th>
<th>Username</th>
<th></th>
</tr>
</thead>
<tbody id="officerTableBody"></tbody>
</table>
</div>
</div>

</div>
</div>

<script>
let CURRENT_USER=null;
let CURRENT_ROLE=null;

// LOGIN
function handleLogin(){
const u=userInp.value;
const p=passInp.value;

if(u==="admin" && p==="admin123"){
setup("Admin","Admin");
return;
}

google.script.run.withSuccessHandler(function(user){
if(user){
setup(user.name,"Officer");
}else{
errorMsg.innerText="Invalid login";
}
}).checkLogin(u,p);
}

// SETUP
function setup(name,role){
CURRENT_USER=name;
CURRENT_ROLE=role;

loginPage.style.display="none";
dashboardPage.style.display="block";

if(role==="Admin"){
adminLink.style.display="block";
}

refreshData();
}

// LOAD
function refreshData(){
google.script.run.withSuccessHandler(renderRecruits).getFilteredData();

if(CURRENT_ROLE==="Admin"){
google.script.run.withSuccessHandler(renderOfficers).getOfficers();
}
}

// RENDER
function renderRecruits(data){
let html="";
data.slice(1).forEach(r=>{
html+=`
<tr>
<td>${r[1]}</td>
<td>${r[2]}</td>
<td>${r[3]}</td>
<td>
<button class="btn btn-accent" onclick="mark('${r[0]}')">✔</button>
<button class="btn btn-danger" onclick="removeRow('Recruits','${r[0]}')">🗑</button>
</td>
</tr>`;
});
recruitTableBody.innerHTML=html;
}

function renderOfficers(data){
let html="";
data.slice(1).forEach(r=>{
html+=`
<tr>
<td>${r[1]}</td>
<td>${r[2]}</td>
<td>
<button class="btn btn-danger" onclick="removeRow('Officers','${r[0]}')">❌</button>
</td>
</tr>`;
});
officerTableBody.innerHTML=html;
}

// ACTIONS
function openAddRecruit(){
let name=prompt("Recruit Name");
if(name){
google.script.run.withSuccessHandler(refreshData).addRecruit(name,CURRENT_USER);
}
}

function openAddOfficer(){
let name=prompt("Name");
let user=prompt("Username");
let pass=prompt("Password");

if(name&&user&&pass){
google.script.run.withSuccessHandler(refreshData).addOfficer(name,user,pass);
}
}

function mark(id){
google.script.run.withSuccessHandler(alert).markAttendance(id);
refreshData();
}

function removeRow(type,id){
if(confirm("Delete?")){
google.script.run.withSuccessHandler(refreshData).deleteRow(type,id);
}
}

// UI
function toggleMenu(){
sidebar.classList.toggle("active");
}

function switchTab(tab){
recruitView.style.display = tab==="recruits"?"block":"none";
officerView.style.display = tab==="officers"?"block":"none";
}

function logout(){
location.reload();
}
</script>

</body>
</html>
