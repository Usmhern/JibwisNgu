<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>System</title>

<style>
body{font-family:Arial;background:#0f0f1a;color:white;margin:0}
.hidden{display:none}

#login{
  height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
}

.box{
  background:#1a1a2e;
  padding:20px;
  border-radius:10px;
  width:280px;
}

input{
  width:100%;
  padding:10px;
  margin:10px 0;
}

button{
  width:100%;
  padding:10px;
  background:#8e2de2;
  border:none;
  color:white;
  cursor:pointer;
}

#dash{
  display:flex;
}

.sidebar{
  width:200px;
  background:#111;
  height:100vh;
  padding:10px;
}

.main{
  flex:1;
  padding:20px;
}
</style>
</head>

<body>

<!-- LOGIN -->
<div id="login">
  <div class="box">
    <h3>Login</h3>
    <input id="u" placeholder="username">
    <input id="p" type="password" placeholder="password">
    <button onclick="login()">Login</button>
    <p id="msg"></p>
  </div>
</div>

<!-- DASH -->
<div id="dash" class="hidden">

<div class="sidebar">
  <h4 id="info"></h4>
  <div onclick="load()">Recruits</div>
</div>

<div class="main">
  <h3>Dashboard</h3>
  <div id="out"></div>
</div>

</div>

<script>
const API="https://script.google.com/macros/s/AKfycbyNygJFW5OmJLMKxTEDzTTQDFmEYCcw4MMpW6qYpAB5OAnpFUxe2i28JqkUZs5tcF8/exec";

let ROLE="",USER="";

/* SAFE FETCH */
async function post(data){
  try{
    let r=await fetch(API,{
      method:"POST",
      body:JSON.stringify(data)
    });

    let text=await r.text();
    return JSON.parse(text);
  }catch(e){
    console.log(e);
    return {success:false};
  }
}

/* LOGIN */
async function login(){

let u=document.getElementById("u").value;
let p=document.getElementById("p").value;

let res=await post({
  action:"login",
  username:u,
  password:p
});

if(res.success){

ROLE=res.role;
USER=res.username || res.name;

login.style.display="none";
dash.classList.remove("hidden");

info.innerText=ROLE+" | "+USER;

load();

}else{
msg.innerText="Invalid login";
}
}

/* LOAD RECRUITS */
async function load(){

let res=await post({
  action:"getRecruits",
  role:ROLE,
  user:USER
});

if(res.success){

out.innerHTML=res.data.map(r=>
  `<div>${r.name} - ${r.officer}</div>`
).join("");

}
}
</script>

</body>
</html>
