<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JIBWIS Nguru - First Aid System</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">

<style>
:root {
    --primary: #1b5e20;
    --gold: #ffd700;
    --danger: #c62828;
    --bg: #f4f7f6;
}

body {
    font-family: 'Poppins', sans-serif;
    margin: 0;
    background: var(--bg);
}

.hidden { display: none !important; }

/* LOGIN */
#loginPage {
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    background: linear-gradient(135deg, #1b5e20, #2e7d32);
}

.login-card {
    background: white;
    padding: 40px;
    border-radius: 15px;
    width: 350px;
    text-align: center;
}

input, select {
    width: 100%;
    padding: 12px;
    margin: 10px 0;
    border-radius: 8px;
    border: 1px solid #ddd;
}

/* DASHBOARD */
#dashPage {
    display: flex;
}

/* SIDEBAR */
.sidebar {
    width: 250px;
    background: var(--primary);
    color: white;
    height: 100vh;
    position: fixed;
}

.sidebar h3 {
    padding: 20px;
    margin: 0;
}

.nav-item {
    padding: 15px 20px;
    cursor: pointer;
}

.nav-item:hover {
    background: rgba(255,255,255,0.1);
}

/* MAIN */
.main {
    margin-left: 250px;
    padding: 30px;
    width: 100%;
}

.card {
    background: white;
    padding: 20px;
    border-radius: 12px;
}

/* TABLE */
table {
    width: 100%;
    border-collapse: collapse;
    margin-top: 20px;
}

th {
    background: var(--primary);
    color: white;
    padding: 12px;
}

td {
    padding: 12px;
    border-bottom: 1px solid #eee;
}

/* BUTTONS */
.btn {
    padding: 10px 15px;
    border: none;
    border-radius: 6px;
    cursor: pointer;
}

.btn-green { background: var(--primary); color: white; }
.btn-gold { background: var(--gold); }
.btn-red { background: var(--danger); color: white; }

/* MODAL */
.modal {
    position: fixed;
    top:0; left:0;
    width:100%; height:100%;
    background: rgba(0,0,0,0.5);
    display:flex;
    justify-content:center;
    align-items:center;
}

.modal-content {
    background:white;
    padding:25px;
    border-radius:10px;
    width:300px;
}
</style>
</head>

<body>

<!-- LOGIN -->
<div id="loginPage">
    <div class="login-card">
        <h2>JIBWIS NGURU</h2>
        <input id="u" placeholder="Username">
        <input id="p" type="password" placeholder="Password">
        <button class="btn btn-green" onclick="doLogin()">Login</button>
    </div>
</div>

<!-- DASHBOARD -->
<div id="dashPage" class="hidden">

<div class="sidebar">
    <h3>JIBWIS</h3>
    <div id="roleText"></div>
    <div class="nav-item" onclick="showSection('recruits')">Recruits</div>
    <div id="adminLink" class="nav-item hidden" onclick="showSection('officers')">Officers</div>
</div>

<div class="main">

<!-- RECRUITS -->
<div id="recruitsSection">
    <h2>Recruits</h2>
    <button class="btn btn-green" onclick="openModal('Recruit')">+ Add Recruit</button>

    <div class="card">
        <table>
            <thead>
                <tr><th>Name</th><th>Officer</th><th>Attendance</th><th>Action</th></tr>
            </thead>
            <tbody id="rBody"></tbody>
        </table>
    </div>
</div>

<!-- OFFICERS -->
<div id="officersSection" class="hidden">
    <h2>Officers</h2>
    <button class="btn btn-green" onclick="openModal('Officer')">+ Add Officer</button>

    <div class="card">
        <table>
            <thead>
                <tr><th>Name</th><th>Username</th><th>Action</th></tr>
            </thead>
            <tbody id="oBody"></tbody>
        </table>
    </div>
</div>

</div>
</div>

<!-- MODAL -->
<div id="modal" class="modal hidden">
    <div class="modal-content">
        <h3 id="modalTitle"></h3>
        <input id="nameField" placeholder="Name">

        <div id="officerFields" class="hidden">
            <input id="userField" placeholder="Username">
            <input id="passField" placeholder="Password">
        </div>

        <button class="btn btn-green" onclick="submitForm()">Save</button>
        <button onclick="closeModal()">Cancel</button>
    </div>
</div>

<script>
const API_URL = "https://script.google.com/macros/s/AKfycbyMmxj09yTqmPgz4fpzY9qGGQx-sA0fLzg21wXPe1YBU86OVbt0jkXOqxuoNH25gIkk/exec";

let ROLE="", ME="", currentType="";

async function apiCall(data){
    const res = await fetch(API_URL,{
        method:'POST',
        body: JSON.stringify(data)
    });
    return res.json();
}

/* LOGIN */
async function doLogin(){
    let u = u.value, p = p.value;
    let res = await apiCall({action:"login",u,p});
    if(res.success){
        ROLE=res.role; ME=res.name;
        loginPage.classList.add('hidden');
        dashPage.classList.remove('hidden');
        roleText.innerText = ROLE+" | "+ME;

        if(ROLE==="Admin"){
            adminLink.classList.remove('hidden');
        }

        loadData();
    } else alert("Invalid login");
}

/* LOAD DATA */
async function loadData(){
    let recruits = await apiCall({action:"getRecruits",role:ROLE,user:ME});

    rBody.innerHTML = recruits.map(r=>`
        <tr>
            <td>${r[1]}</td>
            <td>${r[2]}</td>
            <td>${r[3]}</td>
            <td>
                <button onclick="mark('${r[0]}')">✔</button>
                ${ROLE==="Admin"?`<button onclick="del('Recruits','${r[0]}')">❌</button>`:''}
            </td>
        </tr>
    `).join("");

    /* FIXED OFFICER LOADING */
    if(ROLE==="Admin"){
        let officers = await apiCall({action:"getOfficers"});
        oBody.innerHTML = officers.map(o=>`
            <tr>
                <td>${o[1]}</td>
                <td>${o[2]}</td>
                <td><button onclick="del('Officers','${o[0]}')">Remove</button></td>
            </tr>
        `).join("");
    }
}

/* MODAL */
function openModal(type){
    currentType = type;
    modal.classList.remove('hidden');
    modalTitle.innerText = "Add "+type;

    officerFields.classList.toggle('hidden', type!=="Officer");
}

function closeModal(){
    modal.classList.add('hidden');
}

/* SUBMIT */
async function submitForm(){
    let name = nameField.value;

    if(currentType==="Recruit"){
        await apiCall({action:"addRecruit",name,user:ME});
    } else {
        await apiCall({
            action:"addOfficer",
            name,
            u:userField.value,
            p:passField.value
        });
    }

    closeModal();
    loadData();
}

/* OTHER */
function showSection(s){
    recruitsSection.classList.toggle('hidden', s!=="recruits");
    officersSection.classList.toggle('hidden', s!=="officers");
}

async function mark(id){
    await apiCall({action:"mark",id,user:ME});
    loadData();
}

async function del(type,id){
    if(confirm("Delete?")){
        await apiCall({action:"delete",type,id});
        loadData();
    }
}
</script>

</body>
    </html>
