<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JIBWIS Portal</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="bg-slate-50 min-h-screen">

    <div id="login-screen" class="fixed inset-0 bg-emerald-900 z-[200] flex items-center justify-center p-6">
        <div class="bg-white rounded-3xl p-8 w-full max-w-sm shadow-2xl">
            <div class="text-center mb-8">
                <div class="bg-emerald-100 w-16 h-16 rounded-full flex items-center justify-center mx-auto mb-4">
                    <i data-lucide="shield-check" class="text-emerald-600 w-8 h-8"></i>
                </div>
                <h2 class="text-2xl font-black text-slate-800">JIBWIS Login</h2>
                <p class="text-slate-400 text-sm">Enter your credentials</p>
            </div>
            <div class="space-y-4">
                <input type="email" id="login-email" placeholder="Email Address" class="w-full border p-4 rounded-2xl outline-none focus:ring-2 focus:ring-emerald-500">
                <input type="password" id="login-pass" placeholder="Password" class="w-full border p-4 rounded-2xl outline-none focus:ring-2 focus:ring-emerald-500">
                <button onclick="attemptLogin()" id="login-btn" class="w-full bg-emerald-600 text-white py-4 rounded-2xl font-bold shadow-lg active:scale-95 transition-all">Login</button>
            </div>
            <p id="login-error" class="text-rose-500 text-xs text-center mt-4 hidden"></p>
        </div>
    </div>

    <div id="app" class="hidden pb-24">
        <header id="header-bg" class="bg-emerald-700 p-6 text-white text-center shadow-lg">
            <h1 class="text-xl font-bold tracking-tight">JIBWIS ATTENDANCE</h1>
            <p id="display-email" class="text-[10px] opacity-70"></p>
        </header>

        <main class="max-w-md mx-auto p-4" id="view-container">
            <div id="dynamic-content" class="space-y-6 text-center py-20">
                <p class="text-slate-400">Loading your dashboard...</p>
            </div>
        </main>

        <nav class="fixed bottom-0 left-0 right-0 bg-white border-t p-4 flex justify-around shadow-lg">
            <button onclick="loadMarkingView()" class="flex flex-col items-center text-emerald-600">
                <i data-lucide="check-square"></i><span class="text-[10px] font-bold">MARK</span>
            </button>
            <button onclick="loadStatsView()" class="flex flex-col items-center text-slate-400">
                <i data-lucide="bar-chart"></i><span class="text-[10px] font-bold">STATS</span>
            </button>
        </nav>
    </div>

<script>
    const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbyRTlWkOXJo84sNkUKsOBUsaWnSCRTRbKpk7hUh8rc1ZTMKsABsAI-aRrdKtWo530JdEQ/exec';
    let session = null;

    async function attemptLogin() {
        const email = document.getElementById('login-email').value;
        const password = document.getElementById('login-pass').value;
        const btn = document.getElementById('login-btn');
        const error = document.getElementById('login-error');

        btn.innerText = "Authenticating...";
        
        try {
            const res = await fetch(SCRIPT_URL, {
                method: 'POST',
                body: JSON.stringify({ action: 'login', email, password })
            });
            const data = await res.json();

            if (data.success) {
                session = data;
                document.getElementById('login-screen').classList.add('hidden');
                document.getElementById('app').classList.remove('hidden');
                document.getElementById('display-email').innerText = session.email;
                lucide.createIcons();
                loadMarkingView();
            } else {
                error.innerText = data.message;
                error.classList.remove('hidden');
                btn.innerText = "Login";
            }
        } catch (e) {
            alert("Connection error. Check your AppScript deployment.");
        }
    }

    function loadMarkingView() {
        const content = document.getElementById('dynamic-content');
        if (session.recruits.length === 0) {
            content.innerHTML = `<p class="p-10 text-slate-400">No recruits assigned to you.</p>`;
            return;
        }
        
        let idx = 0;
        const render = () => {
            if (idx < session.recruits.length) {
                content.innerHTML = `
                    <div class="bg-white p-8 rounded-3xl shadow-xl border border-slate-100">
                        <h2 class="text-3xl font-black mb-8">${session.recruits[idx]}</h2>
                        <div class="grid grid-cols-2 gap-4">
                            <button onclick="mark(1)" class="bg-emerald-600 text-white p-4 rounded-2xl font-bold">PRESENT</button>
                            <button onclick="mark(0)" class="bg-slate-800 text-white p-4 rounded-2xl font-bold">ABSENT</button>
                        </div>
                    </div>`;
            } else {
                content.innerHTML = `<h2 class="text-emerald-600 font-bold">All Checked!</h2>`;
            }
        };

        window.mark = async (status) => {
            const name = session.recruits[idx];
            idx++;
            render();
            await fetch(SCRIPT_URL, {
                method: 'POST',
                body: JSON.stringify({ action: 'save_attendance', email: session.email, name, status })
            });
        };
        render();
    }

    async function loadStatsView() {
        const content = document.getElementById('dynamic-content');
        content.innerHTML = "Loading stats...";
        const res = await fetch(SCRIPT_URL, {
            method: 'POST',
            body: JSON.stringify({ action: 'get_stats', email: session.email, role: session.role })
        });
        const { stats } = await res.json();
        content.innerHTML = `<div class="bg-white p-6 rounded-3xl text-left space-y-4">
            <h3 class="font-bold border-b pb-2">Recruit Records</h3>
            ${stats.map(s => `<div class="flex justify-between"><span>${s.name}</span><span class="font-bold text-emerald-600">${s.percentage}%</span></div>`).join('')}
        </div>`;
    }

    lucide.createIcons();
</script>
</body>
</html>
